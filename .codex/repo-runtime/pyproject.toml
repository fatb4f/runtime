[project]
name = "repository-bom-runtime"
version = "0.1.0"
description = "Portable, deterministic Repository BOM generation"
requires-python = ">=3.12"
dependencies = [
  "cyclonedx-python-lib>=11.5.0",
]

[project.scripts]
repo-bom = "repo_bom.cli:main"

[dependency-groups]
test = [
  "hypothesis>=6.161.2",
  "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_intel", "src/repo_bom"]

[tool.uv]
package = true

