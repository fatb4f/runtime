[project]
name = "dotfiles-tooling"
version = "0.1.0"
description = "Python tooling for the dotfiles repository"
requires-python = ">=3.14,<3.15"
dependencies = [
  "dspy==3.2.1",
  "duckdb>=1.5.5",
  "hypothesis>=6.161.2",
  "marimo==0.23.14",
  "pydantic==2.13.4",
  "pytest>=9.1.1",
]

[dependency-groups]
test = [
  "hypothesis>=6.161.2",
  "pytest>=9.1.1",
]

[project.scripts]
codex-profile = "codex_profile.cli:main"
dotfiles-context-workbook = "context_workbook.cli:main"
dotfiles-context-graph = "context_workbook.graph_service:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  ".codex/codex-profile/src/codex_profile",
  ".codex/context-workbook/src/context_workbook",
]

[tool.uv]
package = true
