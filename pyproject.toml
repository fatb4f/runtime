[project]
name = "codex-handoff"
version = "0.1.0"
description = "Codex session handoff runtime"
requires-python = ">=3.14,<3.15"
dependencies = [
  "pydantic==2.13.4",
]

[dependency-groups]
test = [
  "pytest>=9.1.1",
]

[project.scripts]
handoff = "handoff.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handoff"]

[tool.uv]
package = true
